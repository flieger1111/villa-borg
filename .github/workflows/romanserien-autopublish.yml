name: Romanserie Blogger Autopublish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "autopublish/romanserien_title.txt"
      - "autopublish/romanserien_post.html"
      - ".github/workflows/romanserien-autopublish.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Blogger-Token bereitstellen
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"

      - name: Blog-ID sicher aus der öffentlichen Blog-URL ermitteln
        id: blog
        run: |
          BLOG_ID=$(python - <<'PY'
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from pathlib import Path
          SCOPES=["https://www.googleapis.com/auth/blogger"]
          creds=Credentials.from_authorized_user_file(str(Path.home()/"blogger_token.json"),SCOPES)
          service=build("blogger","v3",credentials=creds,cache_discovery=False)
          blog=service.blogs().getByUrl(url="https://romanserien-leukbachtal.blogspot.com/").execute()
          print(blog["id"])
          PY
          )
          echo "blog_id=$BLOG_ID" >> "$GITHUB_OUTPUT"
          echo "Romanserien-Blog eindeutig erkannt."

      - name: Kapitel veröffentlichen
        run: |
          python publish_blogger.py \
            --title autopublish/romanserien_title.txt \
            --html autopublish/romanserien_post.html \
            --blog-id "${{ steps.blog.outputs.blog_id }}" \
            --labels "Perl damals und heute,Das Flüstern der Steine,Band 1,Romanserie,Oberleuken,Villa Borg,Nennig,Regionalgeschichte" \
            --publish
