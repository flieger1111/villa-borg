name: Blogger Autopublish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "autopublish/villa_post.html"
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Prüfe Uhrzeit in Deutschland
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Berlin date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.localtime.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Prüfe frischen Tagesbeitrag
        if: steps.localtime.outputs.run == 'true' && github.event_name == 'schedule'
        shell: bash
        run: |
          now=$(date +%s)
          title_ts=$(git log -1 --format=%ct -- autopublish/villa_title.txt)
          post_ts=$(git log -1 --format=%ct -- autopublish/villa_post.html)
          if [ -z "$title_ts" ] || [ -z "$post_ts" ]; then
            echo "Kein Veröffentlichungsstand gefunden."
            exit 1
          fi
          title_age=$((now-title_ts))
          post_age=$((now-post_ts))
          if [ "$title_age" -gt 10800 ] || [ "$post_age" -gt 10800 ]; then
            echo "Kein frischer Tagesbeitrag innerhalb der letzten 3 Stunden. Veröffentlichung wird sicherheitshalber gestoppt."
            exit 1
          fi
          echo "Frischer Tagesbeitrag erkannt."

      - name: Python einrichten
        if: steps.localtime.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.localtime.outputs.run == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Blogger-Token bereitstellen
        if: steps.localtime.outputs.run == 'true'
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        shell: bash
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"

      - name: Villa-Borg-Beitrag veröffentlichen
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          labels=()
          if grep -qi "wochenendführer" autopublish/villa_title.txt; then
            labels=(--labels "Wochenendführer")
          fi
          python publish_blogger.py \
            --title autopublish/villa_title.txt \
            --html autopublish/villa_post.html \
            --publish \
            --update-existing-title "${labels[@]}"
