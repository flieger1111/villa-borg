name: Blogger Autopublish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Direkt veröffentlichen statt Entwurf"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Prüfe Uhrzeit in Deutschland
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Berlin date +%H)" = "07" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.localtime.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Python einrichten
        if: steps.localtime.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.localtime.outputs.run == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Blogger-Token bereitstellen
        if: steps.localtime.outputs.run == 'true'
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        shell: bash
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"

      - name: Villa-Borg-Beitrag übertragen
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publish }}" = "true" ]; then
            python publish_blogger.py \
              --title autopublish/villa_title.txt \
              --html autopublish/villa_post.html \
              --publish
          else
            python publish_blogger.py \
              --title autopublish/villa_title.txt \
              --html autopublish/villa_post.html
          fi
