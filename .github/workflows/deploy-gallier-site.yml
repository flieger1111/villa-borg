name: Gallier Website Deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/gallier/**'
      - '.github/workflows/deploy-gallier-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-gallier
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Pages konfigurieren und falls möglich aktivieren
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website-Artefakt vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/gallier

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
