name: Gallier Website Check

# The live GitHub Pages site is published separately from main/(root).
# This legacy workflow must not configure or overwrite that Pages deployment.
# Manual checks only; website content and domain settings remain unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Gallier HTML prüfen
        run: |
          test -s site/gallier/index.html
          grep -qi '<html' site/gallier/index.html
          grep -qi '<title>' site/gallier/index.html
          echo "Gallier website source exists. No deployment or domain changes performed."
