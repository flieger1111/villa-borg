name: EU-Briefing in Google Docs aktualisieren

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "autopublish/eu_briefing.txt"
      - "tools/update_eu_briefing.py"
      - ".github/workflows/eu-briefing-docs.yml"

permissions:
  contents: read

concurrency:
  group: eu-briefing-docs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Google-Token bereitstellen
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        shell: bash
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"

      - name: Bestehendes EU-Briefing aktualisieren und prüfen
        run: |
          python tools/update_eu_briefing.py \
            --document-id "1g5PqyW7D28z_eMyjkNz3W34prKHGiwqKHeeFr0M-n90" \
            --input autopublish/eu_briefing.txt
