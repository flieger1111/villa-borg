name: Weitere Blogs Autopublish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "autopublish/gallier_title.txt"
      - "autopublish/gallier_post.html"
  schedule:
    - cron: "20 5 * * *"
    - cron: "20 6 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Interfuel
            blog_id: "2224741555781912467"
            title: autopublish/interfuel_title.txt
            html: autopublish/interfuel_post.html
          - name: Villa Borg und die Gallier
            blog_id: "1059539831991894413"
            title: autopublish/gallier_title.txt
            html: autopublish/gallier_post.html
          - name: Kritische Betrachtungen Villa Borg
            blog_id: "3316720945188549518"
            title: autopublish/kritik_title.txt
            html: autopublish/kritik_post.html
          - name: Oldtimer Treff Oberleuken
            blog_id: "71070964330577048"
            title: autopublish/oldtimer_title.txt
            html: autopublish/oldtimer_post.html
          - name: Tempo im Amt
            blog_id: "6948849401707176750"
            title: autopublish/amt_title.txt
            html: autopublish/amt_post.html

    steps:
      - name: Prüfe Auslöser und Uhrzeit
        id: localtime
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Berlin date +%H:%M)" = "07:20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository auschecken
        if: steps.localtime.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Prüfe frischen Beitrag
        id: fresh
        if: steps.localtime.outputs.run == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ matrix.name }}" = "Villa Borg und die Gallier" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          now=$(date +%s)
          title_ts=$(git log -1 --format=%ct -- "${{ matrix.title }}")
          post_ts=$(git log -1 --format=%ct -- "${{ matrix.html }}")
          if [ -z "$title_ts" ] || [ -z "$post_ts" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Kein Veröffentlichungsstand für ${{ matrix.name }} gefunden."
            exit 0
          fi
          title_age=$((now-title_ts))
          post_age=$((now-post_ts))
          if [ "$title_age" -gt 21600 ] || [ "$post_age" -gt 21600 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Kein frischer Beitrag für ${{ matrix.name }} innerhalb der letzten 6 Stunden."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Frischer Beitrag für ${{ matrix.name }} erkannt."
          fi

      - name: Python einrichten
        if: steps.localtime.outputs.run == 'true' && steps.fresh.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        if: steps.localtime.outputs.run == 'true' && steps.fresh.outputs.publish == 'true'
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Blogger-Token bereitstellen
        if: steps.localtime.outputs.run == 'true' && steps.fresh.outputs.publish == 'true'
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        shell: bash
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"

      - name: Beitrag veröffentlichen
        if: steps.localtime.outputs.run == 'true' && steps.fresh.outputs.publish == 'true'
        shell: bash
        run: |
          python publish_blogger.py \
            --blog-id "${{ matrix.blog_id }}" \
            --title "${{ matrix.title }}" \
            --html "${{ matrix.html }}" \
            --publish
