name: Geprüfte Aktualitätshinweise
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["maintain_reviewed_posts.py"]
permissions:
  contents: read
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: blogger-6165637049845407616
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Blogger-Anmeldung
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"
      - run: python maintain_reviewed_posts.py
