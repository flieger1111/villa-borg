name: Barrierefreies Perl Autopublish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "autopublish/barrierefreiheit_title.txt"
      - "autopublish/barrierefreiheit_post.html"
      - ".github/workflows/barrierefreiheit-autopublish.yml"
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Blogger-Token bereitstellen
        env:
          BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}
        shell: bash
        run: |
          test -n "$BLOGGER_TOKEN_JSON"
          printf '%s' "$BLOGGER_TOKEN_JSON" > "$HOME/blogger_token.json"
          chmod 600 "$HOME/blogger_token.json"

      - name: Beitrag Barrierefreies Perl veröffentlichen
        shell: bash
        run: |
          python publish_blogger.py \
            --title autopublish/barrierefreiheit_title.txt \
            --html autopublish/barrierefreiheit_post.html \
            --labels "Barrierefreies Perl,Barrierefreiheit,Gemeinde Perl" \
            --update-existing-title \
            --publish
